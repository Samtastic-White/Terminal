[package]
name = "native-terminal"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["wayland", "x11"] }
portable-pty = "0.9.0"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-width = "0.2.3"
vte = { version = "0.15.0", default-features = false }

[profile.release]
lto = "thin"
opt-level = 3
